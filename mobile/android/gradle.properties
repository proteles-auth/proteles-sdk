org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Keep the build polite on a machine that does other work too.
org.gradle.workers.max=4
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# The version of both native SDKs, and the one place it is written: :core,
# :android and the example app's versionName read it here. The READMEs' install
# lines (the iOS one's `from:` included) are held to it by
# scripts/publish-readiness.mjs, and mobile/scripts/release.sh refuses an
# `X.Y.Z` release tag that does not name it. The npm packages are versioned
# apart, on `npm-vX.Y.Z` tags.
VERSION_NAME=0.1.0

# What every published POM says about the project (the root build.gradle.kts
# applies it). Maven Central refuses a component whose POM lacks a name,
# description, url, licence, developers or scm.
#
# The project and its source are this repository. The SCM URLs name the
# repository root, not mobile/android: Maven's scm element has no subdirectory,
# and a tag (`X.Y.Z`) is of the whole repository.
#
# **PLACEHOLDER for the maintainers:** POM_DEVELOPER_EMAIL names nothing real yet.
# It is on `.invalid`, a domain reserved never to resolve (RFC 2606):
# `scripts/publish-readiness.mjs --release` refuses a POM that still contains
# one, and mobile/scripts/release.sh refuses to start while one is left here.
POM_URL=https://github.com/proteles-auth/proteles-sdk
POM_SCM_URL=https://github.com/proteles-auth/proteles-sdk
POM_SCM_CONNECTION=scm:git:https://github.com/proteles-auth/proteles-sdk.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/proteles-auth/proteles-sdk.git
POM_DEVELOPER_ID=proteles
POM_DEVELOPER_NAME=Proteles
POM_DEVELOPER_EMAIL=DEVELOPER-EMAIL-NOT-SET@proteles.invalid
